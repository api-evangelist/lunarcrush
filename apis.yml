aid: lunarcrush
name: LunarCrush
description: >-
  LunarCrush is a real-time social intelligence platform for crypto, stocks, and
  trending topics. It aggregates billions of public posts from X (Twitter), Reddit,
  YouTube, TikTok, Instagram, and News across 4,000+ assets, runs them through topic
  classification, spam/bot filtering, sentiment scoring, and creator weighting, and
  turns them into proprietary metrics such as Galaxy Score, AltRank, TopicRank,
  CreatorRank, Social Dominance, and Sentiment. LunarCrush exposes this data through
  two developer surfaces: the LunarCrush API v4 (a REST API at lunarcrush.com/api4 for
  topics, categories, creators, posts, coins, stocks, and NFTs) and lunarcrush.ai (an
  AI/agent-native interface returning markdown/JSON/CSV, with a hosted Model Context
  Protocol server and a first-party CLI). Both use Bearer-token API-key authentication.
